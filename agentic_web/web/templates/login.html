<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · Web Agent</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090d16;color:#e2e8f0;font:15px/1.7 -apple-system,BlinkMacSystemFont,sans-serif;padding:24px}
    main{width:100%;max-width:420px;padding:40px;border:1px solid #334155;border-radius:20px;background:#0f172a}h1{font-size:26px;margin:8px 0}p{color:#94a3b8;margin:8px 0 24px}.brand{color:#a5b4fc;font-weight:700;letter-spacing:2px;font-size:12px}
    button{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:13px;border:1px solid #747775;border-radius:8px;background:#fff;color:#1f1f1f;font-size:15px;cursor:pointer}button:disabled{opacity:.5;cursor:default}button:hover:not(:disabled){background:#f1f5f9}.google-g{font-size:20px;font-weight:700;color:#4285f4}.notice{padding:12px;border-radius:8px;background:#1e293b;font-size:13px;color:#cbd5e1}.error{color:#fda4af}footer{font-size:12px;color:#64748b;margin-top:20px}
  </style>
</head>
<body><main>
  <div class="brand">WEB AGENT</div><h1>로그인</h1>
  <p>사이트의 스킬을 관리하고<br>워크플로우를 실행하세요.</p>
  {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('auth.google_login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" {% if not configured %}disabled{% endif %}><span class="google-g" aria-hidden="true">G</span>Google 계정으로 로그인</button>
  </form>
  {% if not configured %}<p class="notice" style="margin-top:20px">Google 로그인을 준비 중입니다. 관리자에게 문의하세요.</p>{% endif %}
  <footer>로그인에는 이름과 이메일 정보만 사용합니다.</footer>
</main></body></html>
